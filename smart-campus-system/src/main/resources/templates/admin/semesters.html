<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Semesters</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><a href="/admin/dashboard" class="navbar-brand">Admin</a></div></nav><div class="container mt-4"><h3>Semesters</h3><table class="table table-bordered"><tr><th>ID</th><th>Name</th><th>Year</th><th>Current</th></tr><tr th:each="s : ${semesters}"><td th:text="${s.id}"></td><td th:text="${s.name}"></td><td th:text="${s.academicYear?.yearLabel}"></td><td th:text="${s.current}"></td></tr></table><form th:action="@{/admin/semesters}" method="post" class="card p-3"><input name="name" placeholder="Semester 1" class="form-control mb-2"><input name="code" placeholder="SEM1" class="form-control mb-2"><select name="academicYearId" class="form-control mb-2"><option th:each="y : ${years}" th:value="${y.id}" th:text="${y.yearLabel}"></option></select><label><input type="checkbox" name="current" value="true"> Current</label><button class="btn btn-primary mt-2">Save</button></form></div></body></html>
