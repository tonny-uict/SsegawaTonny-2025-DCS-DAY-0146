<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Departments</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a href="/admin/dashboard" class="navbar-brand">Admin</a><a href="/logout" class="btn btn-danger btn-sm">Logout</a></div></nav>
<div class="container mt-4"><h3>Departments</h3>
<table class="table table-bordered"><tr><th>ID</th><th>Name</th><th>Code</th><th>HOD</th></tr><tr th:each="d : ${departments}"><td th:text="${d.id}"></td><td th:text="${d.name}"></td><td th:text="${d.code}"></td><td th:text="${d.headOfDepartment}"></td></tr></table>
<form th:action="@{/admin/departments}" method="post" class="card p-3"><h5>Add Department</h5><input name="name" placeholder="Name" class="form-control mb-2" required><input name="code" placeholder="Code" class="form-control mb-2"><input name="headOfDepartment" placeholder="HOD" class="form-control mb-2"><button class="btn btn-primary">Save</button></form>
</div></body></html>
