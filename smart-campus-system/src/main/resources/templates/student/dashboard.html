<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Student Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-warning"><div class="container"><span class="navbar-brand text-dark" th:text="'Student: ' + ${student?.firstName + ' ' + student?.lastName + ' ('+student?.registrationNumber+')'}">Student</span><div><a href="/student/courses" class="btn btn-sm btn-dark">Courses</a> <a href="/student/results" class="btn btn-sm btn-dark">Results</a> <a href="/student/transcript" class="btn btn-sm btn-success">Transcript</a> <a href="/student/attendance" class="btn btn-sm btn-secondary">Attendance</a> <a href="/logout" class="btn btn-sm btn-danger">Logout</a></div></div></nav>
<div class="container mt-4">
<div class="row">
<div class="col-md-4"><div class="card text-center"><div class="card-body"><h3 th:text="${gpa}">0.0</h3><p>GPA</p><small th:text="${standing}"></small></div></div></div>
<div class="col-md-8"><div class="card"><div class="card-header">Profile</div><div class="card-body"><p><b>Reg No:</b> <span th:text="${student?.registrationNumber}"></span> | <b>Program:</b> <span th:text="${student?.program?.name}"></span> | <b>Dept:</b> <span th:text="${student?.department?.name}"></span></p><p><b>Status:</b> <span th:text="${student?.status}"></span> | <b>Phone:</b> <span th:text="${student?.phone}"></span></p></div></div></div>
</div>
<div class="row mt-4">
<div class="col-md-6"><h5>Enrolled Courses</h5><table class="table table-sm table-bordered"><tr><th>Code</th><th>Name</th><th>Status</th></tr><tr th:each="e : ${enrollments}"><td th:text="${e.course?.courseCode}"></td><td th:text="${e.course?.courseName}"></td><td th:text="${e.status}"></td></tr></table></div>
<div class="col-md-6"><h5>Recent Results</h5><table class="table table-sm table-bordered"><tr><th>Course</th><th>Total</th><th>Grade</th><th>GP</th></tr><tr th:each="r : ${results}"><td th:text="${r.course?.courseCode}"></td><td th:text="${r.totalMarks}"></td><td th:text="${r.grade}"></td><td th:text="${r.gradePoint}"></td></tr></table></div>
</div>
</div></body></html>
