<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Transcript</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>@media print{.no-print{display:none;}}</style></head><body>
<div class="container mt-4" style="max-width:900px; border:2px solid #333; padding:20px;">
<div class="text-center"><h3>SMART CAMPUS UNIVERSITY</h3><p>Official Academic Transcript</p><hr><p><b th:text="${student?.firstName + ' ' + student?.lastName}"></b> | Reg: <span th:text="${student?.registrationNumber}"></span> | Program: <span th:text="${student?.program?.name}"></span></p></div>
<table class="table table-bordered table-sm"><tr><th>Course Code</th><th>Course Name</th><th>Credits</th><th>Total</th><th>Grade</th><th>GP</th></tr><tr th:each="r : ${results}"><td th:text="${r.course?.courseCode}"></td><td th:text="${r.course?.courseName}"></td><td th:text="${r.course?.creditUnits}"></td><td th:text="${r.totalMarks}"></td><td th:text="${r.grade}"></td><td th:text="${r.gradePoint}"></td></tr></table>
<div class="row mt-3"><div class="col">Total Credits: <b th:text="${totalCredits}"></b></div><div class="col">GPA: <b th:text="${gpa}"></b></div><div class="col">Standing: <b th:text="${standing}"></b></div></div>
<p class="text-center mt-4">___________________<br>Registrar Academic Affairs</p>
<button onclick="window.print()" class="btn btn-primary no-print mt-3">Print / Download PDF</button>
<a href="/student/dashboard" class="btn btn-secondary no-print mt-3">Back</a>
</div></body></html>
