<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Attendance</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-warning"><div class="container"><a href="/student/dashboard" class="navbar-brand text-dark">Attendance</a></div></nav>
<div class="container mt-4"><h3>My Attendance</h3><table class="table table-bordered table-sm"><tr><th>Date</th><th>Course</th><th>Status</th></tr><tr th:each="a : ${attendances}"><td th:text="${a.date}"></td><td th:text="${a.course?.courseCode}"></td><td th:text="${a.status}"></td></tr></table><p th:if="${#lists.isEmpty(attendances)}" class="text-muted">No attendance records yet.</p></div></body></html>
