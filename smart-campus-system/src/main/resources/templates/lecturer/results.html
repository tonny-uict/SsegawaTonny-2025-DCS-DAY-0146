<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Enter Results</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-success"><div class="container"><a href="/lecturer/dashboard" class="navbar-brand">Lecturer - Results</a></div></nav>
<div class="container mt-4">
<form th:action="@{/lecturer/results}" method="post" class="card p-3 mb-4"><h5>Enter Coursework (40) & Exam (60)</h5><div class="row g-2"><div class="col"><select name="studentId" class="form-control"><option th:each="s : ${students}" th:value="${s.id}" th:text="${s.registrationNumber}"></option></select></div><div class="col"><select name="courseId" class="form-control"><option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.courseCode}"></option></select></div><div class="col"><input name="coursework" type="number" step="0.1" max="40" placeholder="Coursework" class="form-control" required></div><div class="col"><input name="exam" type="number" step="0.1" max="60" placeholder="Exam" class="form-control" required></div><div class="col"><button class="btn btn-success">Save</button></div></div></form>
<h5>Saved Results (Auto-graded)</h5><table class="table table-bordered table-sm"><tr><th>Student</th><th>Course</th><th>CW</th><th>Exam</th><th>Total</th><th>Grade</th><th>Remarks</th></tr><tr th:each="r : ${results}"><td th:text="${r.student?.registrationNumber}"></td><td th:text="${r.course?.courseCode}"></td><td th:text="${r.courseworkMarks}"></td><td th:text="${r.examMarks}"></td><td th:text="${r.totalMarks}"></td><td><span class="badge bg-primary" th:text="${r.grade}"></span></td><td th:text="${r.remarks}"></td></tr></table>
</div></body></html>
