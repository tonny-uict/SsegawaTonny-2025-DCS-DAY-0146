<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Attendance</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-success"><div class="container"><a href="/lecturer/dashboard" class="navbar-brand">Lecturer - Attendance</a></div></nav>
<div class="container mt-4">
<form th:action="@{/lecturer/attendance}" method="post" class="card p-3 mb-4"><h5>Record Attendance</h5><div class="row"><div class="col"><select name="studentId" class="form-control"><option th:each="s : ${students}" th:value="${s.id}" th:text="${s.registrationNumber + ' - ' + s.firstName}"></option></select></div><div class="col"><select name="courseId" class="form-control"><option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.courseCode}"></option></select></div><div class="col"><select name="status" class="form-control"><option>PRESENT</option><option>ABSENT</option><option>LATE</option></select></div><div class="col"><button class="btn btn-success">Save</button></div></div></form>
<h5>Recent Records</h5><table class="table table-bordered table-sm"><tr><th>Student</th><th>Course</th><th>Date</th><th>Status</th></tr><tr th:each="a : ${records}"><td th:text="${a.student?.registrationNumber}"></td><td th:text="${a.course?.courseCode}"></td><td th:text="${a.date}"></td><td th:text="${a.status}"></td></tr></table>
</div></body></html>
