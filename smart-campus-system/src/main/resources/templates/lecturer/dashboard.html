<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Lecturer Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-success"><div class="container"><span class="navbar-brand">Lecturer Dashboard - <span th:text="${lecturer?.user?.fullName}">Lecturer</span></span><div><a href="/lecturer/courses" class="btn btn-sm btn-light">My Courses</a> <a href="/lecturer/attendance" class="btn btn-sm btn-light">Attendance</a> <a href="/lecturer/results" class="btn btn-sm btn-light">Results</a> <a href="/lecturer/reports" class="btn btn-sm btn-warning">Reports</a> <a href="/logout" class="btn btn-sm btn-danger">Logout</a></div></div></nav>
<div class="container mt-4">
<h3>My Assigned Courses</h3>
<div class="row"><div class="col-md-4" th:each="c : ${courses}"><div class="card mb-3"><div class="card-body"><h5 th:text="${c.courseCode + ' - ' + c.courseName}"></h5><p th:text="${c.description}"></p><p>Credits: <span th:text="${c.creditUnits}"></span></p><a th:href="@{'/lecturer/course/' + ${c.id} + '/students'}" class="btn btn-primary btn-sm">View Students</a></div></div></div></div>
<p th:if="${#sets.isEmpty(courses)}" class="text-muted">No courses assigned yet. Ask admin to assign.</p>
<p>Total Students in System: <span th:text="${totalStudents}"></span></p>
</div></body></html>
