<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Reports</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-success"><div class="container"><a href="/lecturer/dashboard" class="navbar-brand">Reports</a></div></nav>
<div class="container mt-4"><h3>Course Reports</h3><table class="table table-bordered"><tr><th>Student</th><th>Course</th><th>Total</th><th>Grade</th><th>GP</th></tr><tr th:each="r : ${results}"><td th:text="${r.student?.registrationNumber}"></td><td th:text="${r.course?.courseName}"></td><td th:text="${r.totalMarks}"></td><td th:text="${r.grade}"></td><td th:text="${r.gradePoint}"></td></tr></table></div></body></html>
