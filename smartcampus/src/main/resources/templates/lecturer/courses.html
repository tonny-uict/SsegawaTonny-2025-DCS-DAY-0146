<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>My Courses</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-success"><div class="container"><a href="/lecturer/dashboard" class="navbar-brand">Lecturer</a><a href="/logout" class="btn btn-danger btn-sm">Logout</a></div></nav>
<div class="container mt-4"><h3>My Courses</h3><table class="table table-bordered"><tr><th>Code</th><th>Name</th><th>Credits</th><th>Action</th></tr><tr th:each="c : ${courses}"><td th:text="${c.courseCode}"></td><td th:text="${c.courseName}"></td><td th:text="${c.creditUnits}"></td><td><a th:href="@{'/lecturer/course/' + ${c.id} + '/students'}" class="btn btn-sm btn-primary">Students</a></td></tr></table></div></body></html>
