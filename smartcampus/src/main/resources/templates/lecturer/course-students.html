<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Course Students</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-success"><div class="container"><a href="/lecturer/dashboard" class="navbar-brand">Lecturer</a></div></nav>
<div class="container mt-4"><h3 th:text="${course?.courseName + ' ('+course?.courseCode+')'}">Course</h3><table class="table table-bordered table-striped"><tr><th>Reg No</th><th>Student</th><th>Status</th><th>Date</th></tr><tr th:each="e : ${enrollments}"><td th:text="${e.student?.registrationNumber}"></td><td th:text="${e.student?.firstName +' '+ e.student?.lastName}"></td><td th:text="${e.status}"></td><td th:text="${e.enrollmentDate}"></td></tr></table></div></body></html>
