<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Admin Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><span class="navbar-brand">Admin Dashboard</span><div><a href="/admin/courses" class="btn btn-sm btn-outline-light">Courses</a> <a href="/admin/departments" class="btn btn-sm btn-outline-light">Departments</a> <a href="/admin/programs" class="btn btn-sm btn-outline-light">Programs</a> <a href="/admin/students" class="btn btn-sm btn-outline-light">Students</a> <a href="/admin/reports" class="btn btn-sm btn-warning">Reports</a> <a href="/logout" class="btn btn-sm btn-danger">Logout</a></div></div></nav>
<div class="container mt-4">
<h3>Admin Overview</h3>
<div class="row text-center">
<div class="col-md-3"><div class="card"><div class="card-body"><h3 th:text="${studentCount}">0</h3><p>Students</p></div></div></div>
<div class="col-md-3"><div class="card"><div class="card-body"><h3 th:text="${lecturerCount}">0</h3><p>Lecturers</p></div></div></div>
<div class="col-md-3"><div class="card"><div class="card-body"><h3 th:text="${courseCount}">0</h3><p>Courses</p></div></div></div>
<div class="col-md-3"><div class="card"><div class="card-body"><h3 th:text="${deptCount}">0</h3><p>Departments</p></div></div></div>
</div>
<div class="row mt-4">
<div class="col-md-6"><h5>Students</h5><table class="table table-sm table-striped"><tr><th>Reg No</th><th>Name</th><th>Program</th></tr><tr th:each="s : ${students}"><td th:text="${s.registrationNumber}"></td><td th:text="${s.firstName + ' ' + s.lastName}"></td><td th:text="${s.program?.name}"></td></tr></table></div>
<div class="col-md-6"><h5>Courses</h5><table class="table table-sm table-striped"><tr><th>Code</th><th>Name</th><th>Credits</th></tr><tr th:each="c : ${courses}"><td th:text="${c.courseCode}"></td><td th:text="${c.courseName}"></td><td th:text="${c.creditUnits}"></td></tr></table></div>
</div>
<p class="mt-3"><a href="/" class="btn btn-secondary">Home</a></p>
</div></body></html>
