<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Reports</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><a href="/admin/dashboard" class="navbar-brand">Admin Reports</a><a href="/logout" class="btn btn-danger btn-sm">Logout</a></div></nav><div class="container mt-4"><h3>Academic Reports</h3><table class="table table-bordered table-sm"><tr><th>Student</th><th>Course</th><th>CW</th><th>Exam</th><th>Total</th><th>Grade</th><th>Remarks</th></tr><tr th:each="r : ${results}"><td th:text="${r.student?.registrationNumber}"></td><td th:text="${r.course?.courseCode}"></td><td th:text="${r.courseworkMarks}"></td><td th:text="${r.examMarks}"></td><td th:text="${r.totalMarks}"></td><td th:text="${r.grade}"></td><td th:text="${r.remarks}"></td></tr></table></div></body></html>
