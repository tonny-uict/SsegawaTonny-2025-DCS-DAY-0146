<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Programs</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a href="/admin/dashboard" class="navbar-brand">Admin</a><a href="/logout" class="btn btn-danger btn-sm">Logout</a></div></nav>
<div class="container mt-4"><h3>Programs</h3>
<table class="table table-bordered"><tr><th>ID</th><th>Name</th><th>Code</th><th>Department</th></tr><tr th:each="p : ${programs}"><td th:text="${p.id}"></td><td th:text="${p.name}"></td><td th:text="${p.code}"></td><td th:text="${p.department?.name}"></td></tr></table>
<form th:action="@{/admin/programs}" method="post" class="card p-3"><h5>Add Program</h5><input name="name" placeholder="Name" class="form-control mb-2" required><input name="code" placeholder="Code" class="form-control mb-2"><select name="departmentId" class="form-control mb-2"><option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option></select><button class="btn btn-primary">Save</button></form>
</div></body></html>
