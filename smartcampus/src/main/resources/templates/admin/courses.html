<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Courses</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a href="/admin/dashboard" class="navbar-brand">Admin</a><a href="/logout" class="btn btn-danger btn-sm">Logout</a></div></nav>
<div class="container mt-4"><h3>Courses</h3>
<table class="table table-bordered"><tr><th>Code</th><th>Name</th><th>Credits</th><th>Dept</th></tr><tr th:each="c : ${courses}"><td th:text="${c.courseCode}"></td><td th:text="${c.courseName}"></td><td th:text="${c.creditUnits}"></td><td th:text="${c.department?.name}"></td></tr></table>
<form th:action="@{/admin/courses}" method="post" class="card p-3"><h5>Add Course</h5><input name="courseCode" placeholder="Code e.g. CSC211" class="form-control mb-2" required><input name="courseName" placeholder="Name" class="form-control mb-2" required><input name="creditUnits" type="number" placeholder="Credits" class="form-control mb-2" value="3"><input name="description" placeholder="Description" class="form-control mb-2"><select name="departmentId" class="form-control mb-2"><option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option></select><select name="programId" class="form-control mb-2"><option value="">-- Program (optional) --</option><option th:each="p : ${programs}" th:value="${p.id}" th:text="${p.name}"></option></select><button class="btn btn-primary">Save</button></form>
</div></body></html>
