<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Students</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a href="/admin/dashboard" class="navbar-brand">Admin</a><a href="/logout" class="btn btn-danger btn-sm">Logout</a></div></nav>
<div class="container mt-4"><h3>All Students</h3><table class="table table-bordered table-striped"><tr><th>Reg No</th><th>Name</th><th>Program</th><th>Status</th><th>Phone</th></tr><tr th:each="s : ${students}"><td th:text="${s.registrationNumber}"></td><td th:text="${s.firstName + ' ' + s.lastName}"></td><td th:text="${s.program?.name}"></td><td th:text="${s.status}"></td><td th:text="${s.phone}"></td></tr></table></div></body></html>
