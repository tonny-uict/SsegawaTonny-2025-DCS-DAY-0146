<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Academic Years</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><a href="/admin/dashboard" class="navbar-brand">Admin</a></div></nav><div class="container mt-4"><h3>Academic Years</h3><table class="table table-bordered"><tr><th>ID</th><th>Label</th><th>Current</th></tr><tr th:each="y : ${years}"><td th:text="${y.id}"></td><td th:text="${y.yearLabel}"></td><td th:text="${y.current}"></td></tr></table><form th:action="@{/admin/years}" method="post" class="card p-3"><input name="yearLabel" placeholder="2025/2026" class="form-control mb-2"><label><input type="checkbox" name="current" value="true"> Current</label><button class="btn btn-primary mt-2">Save</button></form></div></body></html>
