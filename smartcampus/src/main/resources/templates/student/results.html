<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Results</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-warning"><div class="container"><a href="/student/dashboard" class="navbar-brand text-dark">Results</a></div></nav>
<div class="container mt-4"><h3>My Results - GPA: <span th:text="${gpa}"></span></h3><table class="table table-bordered"><tr><th>Course</th><th>CW/40</th><th>Exam/60</th><th>Total</th><th>Grade</th><th>GP</th><th>Remarks</th></tr><tr th:each="r : ${results}"><td th:text="${r.course?.courseCode}"></td><td th:text="${r.courseworkMarks}"></td><td th:text="${r.examMarks}"></td><td th:text="${r.totalMarks}"></td><td><b th:text="${r.grade}"></b></td><td th:text="${r.gradePoint}"></td><td th:text="${r.remarks}"></td></tr></table><a href="/student/transcript" class="btn btn-success">View Transcript</a></div></body></html>
