<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>My Courses</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-warning"><div class="container"><a href="/student/dashboard" class="navbar-brand text-dark">Student</a></div></nav>
<div class="container mt-4">
<h4>Enrolled Courses</h4><table class="table table-bordered"><tr><th>Code</th><th>Name</th><th>Credits</th><th>Semester</th></tr><tr th:each="e : ${enrollments}"><td th:text="${e.course?.courseCode}"></td><td th:text="${e.course?.courseName}"></td><td th:text="${e.course?.creditUnits}"></td><td th:text="${e.semester?.name}"></td></tr></table>
<h4 class="mt-4">Register for New Course</h4><form th:action="@{/student/courses/register}" method="post" class="card p-3"><select name="courseId" class="form-control mb-2"><option th:each="c : ${availableCourses}" th:value="${c.id}" th:text="${c.courseCode + ' - ' + c.courseName}"></option></select><button class="btn btn-warning">Register</button></form>
</div></body></html>
