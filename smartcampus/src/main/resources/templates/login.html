<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Smart Campus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width:500px; margin-top:80px;">
  <div class="card shadow">
    <div class="card-header bg-primary text-white text-center"><h4>Smart Campus Login</h4></div>
    <div class="card-body">
      <div th:if="${param.error}" class="alert alert-danger">Invalid username or password</div>
      <div th:if="${param.logout}" class="alert alert-success">You have been logged out</div>
      <form th:action="@{/login}" method="post">
        <div class="mb-3"><label>Username</label><input type="text" name="username" class="form-control" required></div>
        <div class="mb-3"><label>Password</label><input type="password" name="password" class="form-control" required></div>
        <button class="btn btn-primary w-100">Login</button>
      </form>
      <hr>
      <p class="small text-muted">Demo accounts:<br>
        <b>admin</b> / admin123 (ADMIN)<br>
        <b>lecturer1</b> / lecturer123 (LECTURER)<br>
        <b>student1</b> / student123 (STUDENT)<br>
        <b>student2</b> / student123
      </p>
      <a href="/" class="btn btn-link w-100">Back Home</a>
    </div>
  </div>
</div>
</body>
</html>
